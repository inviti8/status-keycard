apply plugin: 'javacard'

project.ext.set("com.fidesmo.gradle.javacard.home", "./sdks/jc304_kit")

buildscript {
  repositories {
    maven { url 'http://releases.marmeladburk.fidesmo.com/' }
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://mvn.javacard.pro/maven/' }
  }

  dependencies {
    classpath 'com.fidesmo:gradle-javacard:0.2.7'
  }
}

javacard {
  sdkVersion = "3.0.4"

  cap {
    aid = '0xA0:0x00:0x00:0x08:0x04:0x00:0x01'
    packageName = 'im.status.keycard'
    applet {
      aid = '0xA0:0x00:0x00:0x08:0x04:0x00:0x01:0x01'
      className = 'KeycardApplet'
    }
    applet {
      aid = '0xA0:0x00:0x00:0x08:0x04:0x00:0x01:0x02'
      className = 'NDEFApplet'
    }
    applet {
      aid = '0xA0:0x00:0x00:0x08:0x04:0x00:0x01:0x03'
      className = 'CashApplet'
    }
    applet {
      aid = '0xA0:0x00:0x00:0x08:0x04:0x00:0x01:0x04'
      className = 'IdentApplet'
    }
    version = '4.0'
  }
}

def testTarget = project.properties['im.status.keycard.test.target']
if (!testTarget) {
  testTarget = 'card'
}


repositories {
  mavenCentral()
  maven { url 'https://jitpack.io' }
  maven { url 'https://mvn.javacard.pro/maven/' }
}

dependencies {
  implementation(files('./keycard-math/keycard-math.jar'))
  javacardExport(files('./keycard-math'))
  testCompile(files("./jcardsim/jcardsim-3.0.5-SNAPSHOT.jar"))
  testCompile('org.web3j:core:2.3.1')
  testCompile('org.bitcoinj:bitcoinj-core:0.14.5')
  testCompile('com.github.martinpaljak:apdu4j-pcsc:25.03.11')
  testCompile('com.github.status-im.status-keycard-java:desktop:b4ed9ca')
  testCompile('org.bouncycastle:bcprov-jdk15on:1.65')
  testCompile('com.github.stellar:java-stellar-sdk:0.44.0')
  testCompile("org.junit.jupiter:junit-jupiter-api:5.1.1")
  testRuntime("org.junit.jupiter:junit-jupiter-engine:5.1.1")
}

def jcHome = project.ext.get("com.fidesmo.gradle.javacard.home")

sourceSets {
  probe {
    java { srcDir 'probe/src' }
    compileClasspath = files("${jcHome}/lib/api_classic.jar")
  }
  test {
    compileClasspath += probe.output
    runtimeClasspath += probe.output
  }
}

test {
  classpath = sourceSets.test.runtimeClasspath.filter { f -> f.name != "api_classic.jar" }
  useJUnitPlatform {
    excludeTags 'manual'
  }
}

task install (type: im.status.keycard.build.InstallTask)
task lock (type: im.status.keycard.build.LockTask) //DESTRUCTIVE: Running this task will lock you out of updating the applet!

// Runs the applet suite in jcardsim and serves raw APDUs over TCP (for the Rust client, no hardware).
task simServer (type: JavaExec) {
  dependsOn testClasses
  classpath = sourceSets.test.runtimeClasspath.filter { f -> f.name != "api_classic.jar" }
  main = 'im.status.keycard.SimServer'
  jvmArgs '-noverify'
  if (project.hasProperty('sim.port')) {
    systemProperty 'sim.port', project.property('sim.port')
  }
}

if (testTarget == 'card') {
  tasks.install.dependsOn(convertJavacard)
  tasks.test.dependsOn(install)
}

compileJava {
  sourceCompatibility = 1.6
  targetCompatibility = 1.6
}

compileTestJava {
  sourceCompatibility = 1.8
  targetCompatibility = 1.8
}

// Hardware feasibility probe for the Ed25519 core (probe/src): a separate, dependency-free CAP
// sent to card vendors to run. `./gradlew probeCap` writes build/probe/cap/.../probe.cap.
compileProbeJava {
  sourceCompatibility = 1.6
  targetCompatibility = 1.6
}

task probeCap (type: JavaExec) {
  dependsOn compileProbeJava
  def outDir = file("${buildDir}/probe/cap")
  inputs.dir sourceSets.probe.java.outputDir
  outputs.dir outDir
  // same jars and order as the SDK's bin/converter.bat
  classpath = files(['api_classic', 'tools', 'jctasks', 'commons-logging-1.1', 'commons-httpclient-3.0',
                     'commons-codec-1.3', 'commons-cli-1.0', 'bcel-5.2', 'asm-all-3.1',
                     'api_classic_annotations', 'ant-contrib-1.0b3'].collect { "${jcHome}/lib/${it}.jar" })
  main = 'com.sun.javacard.converter.Main'
  systemProperty 'jc.home', file(jcHome).absolutePath
  args '-classdir', sourceSets.probe.java.outputDir,
       '-exportpath', file("${jcHome}/api_export_files"),
       '-out', 'CAP', 'EXP', 'JCA',
       '-d', outDir,
       '-applet', '0xF0:0x4B:0x43:0x50:0x52:0x4F:0x42:0x45:0x01', 'HwProbeApplet',
       'im.status.keycard.probe', '0xF0:0x4B:0x43:0x50:0x52:0x4F:0x42:0x45', '1.0'
}

afterEvaluate {
  // -noverify on every target: the test classpath always holds jcardsim's rewritten API classes
  // (the probe and Ed25519 primitive tests run in the simulator regardless), and without it JUnit
  // fails discovery with a VerifyError and the card run silently executes zero tests.
  def jvmArgs = ["-Dim.status.keycard.test.target=${testTarget}", '-noverify']

  def testTask = tasks.getByName('test')
  testTask.jvmArgs(jvmArgs)
}
